name: NAF Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          tools: composer
      - run: pip install --quiet -r requirements.txt
      - name: Refresh the reference from published packages
        run: python tools/gen_reference.py
      - name: Check all pages, including recipes
        run: python tools/check_pages.py
      - name: Copy examples into fresh apps and test HTTP behavior
        run: python tools/test_examples.py
      - name: Build and validate navigation and links
        run: mkdocs build --strict

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt
      # Deploy the reviewed reference snapshot committed alongside the prose.
      - run: mkdocs gh-deploy --strict --force
