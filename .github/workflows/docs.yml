name: NAF Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: pip install --quiet 'mkdocs-material~=9.7'   # 2.0 ist angekündigt und derzeit ohne Lizenz

      # Function index and package overview, read from the published packages so
      # that neither has to be maintained by hand and neither can go stale.
      - name: Generate the reference pages
        run: python tools/gen_reference.py

      # Fails on a declared package that does not exist, or an import naming the
      # wrong namespace — both were in the pages before this existed.
      - name: Check pages against the published packages
        run: python tools/check_pages.py

      - name: Build and deploy
        run: mkdocs gh-deploy --force
