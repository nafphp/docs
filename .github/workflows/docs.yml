name: NAF Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: pip install --quiet 'mkdocs-material~=9.7'   # 2.0 ist angekündigt und derzeit ohne Lizenz

      # Funktionsindex und Paketübersicht aus den veröffentlichten Paketen,
      # damit sie nicht von Hand gepflegt werden müssen und nicht veralten.
      - name: Referenzseiten erzeugen
        run: python tools/gen_reference.py

      # Bricht ab, wenn eine Seite ein Paket voraussetzt, das es nicht gibt.
      - name: requires-Deklarationen prüfen
        run: python tools/check_requires.py

      - name: Bauen und ausliefern
        run: mkdocs gh-deploy --force
