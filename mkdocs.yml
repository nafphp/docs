site_name: NAF
site_description: Not Another Framework — a minimal, functional PHP microframework
site_url: https://nafphp.github.io/docs/
repo_url: https://github.com/nafphp/framework
repo_name: nafphp/framework
docs_dir: pages/

hooks:
  - hooks/requires.py

theme:
  name: material
  logo: assets/naf-logo-small-square.png
  favicon: assets/naf-logo-small-square.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.highlight: { use_pygments: true, pygments_lang_class: true }
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.details

nav:
  - Getting started:
      - What NAF is: index.md
      - Installation: install.md
      - Your first application: first-app.md
  - Core:
      - Routing: routing.md
      - Controller: controllers.md
      - Requests and responses: request-response.md
      - Configuration: configuration.md
      - Dependency Injection: dependency-injection.md
      - Events: events.md
      - Errors and aborting: errors.md
      - Guard: guard.md
      - Serving files: file-downloads.md
      - How plugins work: plugins.md
      - External libraries: external-libraries.md
      - Best practices: best-practices.md
  - Presenting:
      - Views and templates: views.md
      - Forms and validation: forms.md
      - Translations: translations.md
  - Storing:
      - Sessions: sessions.md
      - Database: database.md
      - ORM and repositories: orm.md
  - Doing work:
      - Console commands: console.md
      - Queues and workers: queues.md
      - Scheduled jobs: scheduling.md
      - Sending mail: mail.md
      - HTTP client: http-client.md
  - Identity:
      - Authentication and permissions: auth.md
      - Why auth has this shape: auth-architecture.md
      - Signing in with a provider: oauth-client.md
      - Being the provider: oauth-server.md
  - Machines:
      - MCP tools: mcp.md
  - Reference:
      - Function index: function-index.md
      - Package overview: packages.md
      - Upgrading from NixPHP: upgrading-from-nixphp.md
