site_name: NAF
site_description: Not Another Framework — a minimal, functional PHP microframework
site_url: https://nafphp.github.io/docs/
repo_url: https://github.com/nafphp/framework
repo_name: nafphp/framework
docs_dir: pages/

hooks:
  - hooks/requires.py

theme:
  name: material
  logo: assets/naf-logo-small-square.png
  favicon: assets/naf-logo-small-square.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      extend_pygments_lang:
        - name: php-inline
          lang: php
          options:
            startinline: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.details

nav:
  - Getting started:
      - NAF overview: index.md
      - Installation: install.md
      - Your first application: first-app.md
      - Choosing packages: choosing-packages.md
  - Tutorials and task guides:
      - Choose a scenario: recipes/index.md
      - Small website: recipes/small-website.md
      - JSON API without a database: recipes/simple-json-api.md
      - Handling POST requests: recipes/post-requests.md
      - Contact form: recipes/contact-form.md
      - Login form: recipes/login-form.md
      - JSON API with a database: recipes/json-api.md
  - Core concepts:
      - Application lifecycle: lifecycle.md
      - Routing: routing.md
      - Controllers: controllers.md
      - Requests and responses: request-response.md
      - Configuration: configuration.md
      - Dependency injection: dependency-injection.md
      - Events: events.md
      - Error handling: errors.md
      - Guard rules: guard.md
      - Serving files: file-downloads.md
      - External libraries: external-libraries.md
      - Application design: best-practices.md
  - Plugins:
      - Plugin development: plugins.md
      - Views and templates: views.md
      - Forms and validation: forms.md
      - Flow browser components: flow.md
      - Translations: translations.md
  - Persistence:
      - Sessions: sessions.md
      - Database and migrations: database.md
      - ORM and repositories: orm.md
      - File storage: file-storage.md
  - Commands and integrations:
